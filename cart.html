<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>服装商城 - Shopping Cart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #1d1d1f;
    font-size: 14px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

  /* 页面宽高比例参照 iPhone 12：390 x 844（普通网页，非手机外壳） */
  .app {
    width: 390px;
    height: 844px;
    background: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* 顶部标题栏 */
  .topbar {
    height: 54px; padding: 0 12px;
    display: flex; align-items: center;
    position: sticky; top: 0; z-index: 20;
    background: #fff; border-bottom: 1px solid #f3f3f5;
  }
  .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: #333; }
  .icon-btn .ico { width: 24px; height: 24px; }
  .icon-btn .ico svg { width: 100%; height: 100%; }
  .topbar .title { font-size: 20px; font-weight: 600; position: absolute; left: 50%; transform: translateX(-50%); }

  /* 全选行 */
  .cart-head-row { display: flex; align-items: center; gap: 11px; padding: 15px 16px; }
  .circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #d3d3d8; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .circle.checked { background: #ff2d55; border-color: #ff2d55; }
  .circle .ico { width: 13px; height: 13px; }
  .circle .ico svg { width: 100%; height: 100%; }
  .all-label { flex: 1; font-size: 16px; font-weight: 600; }
  .sel-count { font-size: 14px; color: #ff2d55; font-weight: 600; }

  /* 商品列表（内部滚动）；横向不留 padding，让商品行背景铺满整行 */
  .cart-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 10px; scrollbar-width: none; }
  .cart-list::-webkit-scrollbar { display: none; }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 12px; border-radius: 16px;
    position: relative; /* 父相：给右下角绝对定位的步进器做定位上下文 */
  }
  /* 选中态：无圆角，背景从左侧粉色横向渐变到右侧白色 */
  .cart-item.selected {
    border-radius: 0;
    background: linear-gradient(90deg, #ffe0ea 0%, #ffedf3 45%, #ffffff 100%);
  }
  .cart-item .ph, .img-box {
    width: 76px; height: 76px; border-radius: 14px; flex-shrink: 0;
  }
  .cart-item .ph { background: #f5f5f7; display: flex; align-items: center; justify-content: center; }
  .img-box { overflow: hidden; }
  .p-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-ico { width: 30px; color: #d3d3d8; }
  .ph-ico svg { width: 100%; height: 100%; display: block; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 15.5px; font-weight: 600; }
  /* 特价商品“买一送一”小标识（紧跟商品名） */
  .offer-tag {
    display: inline-block; vertical-align: middle;
    background: #ffe0ea; color: #ff2d55;
    font-size: 10.5px; font-weight: 600;
    padding: 2.5px 7px; border-radius: 7px;
    margin-left: 6px; white-space: nowrap;
  }
  .ci-cat { font-size: 12.5px; color: #a8a8b0; margin: 4px 0; }
  .ci-bottom { margin-top: 6px; padding-right: 92px; } /* 避开右下角步进器，防止价格压在按钮下 */
  .ci-price { font-size: 17px; font-weight: 600; }

  /* 数量步进器：子绝——绝对定位在商品行右下角，脱离文档流，
     不再作为 flex 子元素挤压中间文本 */
  .stepper {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; align-items: center;
    border: 1px solid #e8e8ed; border-radius: 16px;
    overflow: hidden; background: #fff;
  }
  .stepper button {
    width: 28px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: #ff2d55; font-size: 18px; font-weight: 600;
  }
  .stepper button:active { background: #f6f6f8; }
  .stepper .step-num {
    min-width: 26px; text-align: center;
    font-size: 14px; font-weight: 600;
  }
  .stepper .step-ico { width: 13px; height: 13px; }
  .stepper .step-ico svg { width: 100%; height: 100%; display: block; }
  .ci-del {
    width: 30px; height: 30px; align-self: flex-start;
    display: flex; align-items: center; justify-content: center;
    color: #9a9aa2;
  }
  .ci-del .ico { width: 17px; height: 17px; }
  .ci-del .ico svg { width: 100%; height: 100%; }

  /* 满减进度条（固定在结算栏上方） */
  .progress-wrap {
    flex-shrink: 0;
    padding: 10px 16px 12px;
    background: #fff;
  }
  .progress-top {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #8a8a92; margin-bottom: 7px; gap: 8px;
  }
  .progress-top b { color: #ff2d55; font-weight: 600; }
  .progress-amt { white-space: nowrap; color: #b6b6bd; }
  .progress-track {
    height: 8px; border-radius: 4px; background: #f0f0f3; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0;
    border-radius: 4px;
    background: linear-gradient(90deg, #ff7a9c, #ff2d55);
    transition: width .3s ease;
  }

  /* 满减弹窗（达到门槛时从底部浮出，2s 后自动隐藏） */
  .voucher-popup {
    position: absolute;
    left: 16px; right: 16px; bottom: 150px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #d7d7d7;
    padding: 16px;
    display: flex; align-items: center; gap: 12px;
    opacity: 0; transform: translateY(16px) scale(.96);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 60;
  }
  .voucher-popup.show { opacity: 1; transform: translateY(0) scale(1); }
  .voucher-popup .vp-ico { width: 34px; height: 34px; color: #ff2d55; flex-shrink: 0; }
  .voucher-popup .vp-ico svg { width: 100%; height: 100%; }
  .vp-txt { flex: 1; min-width: 0; }
  .vp-txt b { font-size: 15px; display: block; color: #3d2f1d; }
  .vp-txt span { font-size: 12.5px; color: #9a7a5e; display: block; margin-top: 2px; }
  .vp-save { font-size: 14px; color: #ff2d55; font-weight: 600; flex-shrink: 0; }

  /* 底部结算栏（容器内静态） */
  .checkout-bar {
    flex-shrink: 0;
    background: #fff; border-top: 1px solid #f3f3f5;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .cb-info { flex: 1; }
  .cb-count { font-size: 12px; color: #9a9aa2; }
  .cb-total { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .btn-checkout {
    background: #ff2d55; color: #fff;
    border-radius: 10px; padding: 12px 62px;
    font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-checkout .ico { width: 18px; height: 18px; }
  .btn-checkout .ico svg { width: 100%; height: 100%; }
  .btn-checkout.disabled { background: #d9d9df; pointer-events: none; }

  .empty-cart { text-align: center; color: #aaa; font-size: 14px; padding: 80px 20px; line-height: 2; }
</style>
</head>
<body>
<div class="app">

  <!-- 顶部标题栏 -->
  <header class="topbar">
    <button class="icon-btn" onclick="location.href='category.html'" aria-label="back">
      <span class="ico" id="backIco"></span>
    </button>
    <span class="title">Shopping Cart</span>
  </header>

  <!-- 全选行 -->
  <div class="cart-head-row">
    <button class="circle" id="allCircle" aria-label="select all"></button>
    <span class="all-label">All items</span>
    <span class="sel-count" id="selCount">2 selected</span>
  </div>

  <!-- 商品列表 -->
  <div class="cart-list" id="cartList"></div>

  <!-- 满减弹窗（选中金额达到 $1000 时弹出，2s 后隐藏） -->
  <div class="voucher-popup" id="voucherBar"></div>

  <!-- 满减进度条（结算栏上方，随选中金额实时变化） -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span id="progressText"></span>
      <span class="progress-amt" id="progressAmt"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- 底部结算栏 -->
  <div class="checkout-bar">
    <div class="cb-info">
      <div class="cb-count" id="cbCount">2 items selected</div>
      <div class="cb-total" id="cbTotal">$228.00</div>
    </div>
    <button class="btn-checkout" id="btnCheckout">
      Checkout<span class="ico" id="checkoutArrow"></span>
    </button>
  </div>

</div>

<script src="data.js"></script>
<script src="components/icons.js"></script>
<script src="components/common.js"></script>
<script>
  document.getElementById('backIco').innerHTML = Icon.back;
  document.getElementById('checkoutArrow').innerHTML = Icon.right;

  // 购物车运行时数据：来自 CartStore（与首页/分类页搜索加购共享）
  var cart = CartStore.init();
  function persist() { CartStore.save(cart); }

  var voucherCfg = AppData.cartVoucher;
  var wasQualified = false; // 上一次渲染是否已满门槛（只在“跨线”时弹窗）
  var popupTimer = null;

  // 分类 id 转显示名：shoes -> Shoes，men -> Men's
  function catName(catId) {
    for (var i = 0; i < AppData.categories.length; i++) {
      if (AppData.categories[i].id === catId) return AppData.categories[i].name;
    }
    return catId;
  }

  // 渲染购物车列表
  function renderCart() {
    var listEl = document.getElementById('cartList');
    if (cart.length === 0) {
      listEl.innerHTML = '<div class="empty-cart">🛒<br>购物车还是空的<br>去挑选喜欢的商品吧</div>';
      return;
    }
    var html = cart.map(function (item) {
      var p = getProduct(item.id);
      var icoHtml = p.img
        ? '<div class="img-box"><img class="p-img" src="images/' + p.img + '" alt="' + p.name + '"></div>'
        : '<div class="ph"><span class="ph-ico">' + Icon.image + '</span></div>';

      return '<div class="cart-item' + (item.selected ? ' selected' : '') + '">' +
        '<button class="circle' + (item.selected ? ' checked' : '') +
          '" data-toggle="' + item.id + '">' +
          (item.selected ? '<span class="ico">' + Icon.check + '</span>' : '') +
        '</button>' +
        icoHtml +
        '<div class="ci-info">' +
          '<div class="ci-name">' + p.name +
            (p.promo ? '<span class="offer-tag">Buy 1 Get 1</span>' : '') +
          '</div>' +
          '<div class="ci-cat">' + catName(getCatByProductId(item.id)) + '</div>' +
          '<div class="ci-bottom">' +
            '<div class="ci-price">' + money(p.price * item.qty) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-minus="' + item.id + '" aria-label="decrease">−</button>' +
          '<span class="step-num">' + item.qty + '</span>' +
          '<button type="button" data-plus="' + item.id + '" aria-label="increase">+</button>' +
        '</div>' +
        '<button class="ci-del" data-del="' + item.id + '" aria-label="delete">' +
          '<span class="ico">' + Icon.close + '</span>' +
        '</button>' +
      '</div>';
    }).join('');

    listEl.innerHTML = html;
  }

  // 满减弹窗：满额时浮出，2 秒后自动隐藏
  function showVoucherPopup(saved) {
    var bar = document.getElementById('voucherBar');
    bar.innerHTML =
      '<span class="vp-ico">' + Icon.sparkle + '</span>' +
      '<div class="vp-txt"><b>' + voucherCfg.title + '</b><span>' + voucherCfg.desc + '</span></div>' +
      '<span class="vp-save">- ' + money(saved) + '</span>';
    bar.classList.add('show');

    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(function () { bar.classList.remove('show'); }, 2000);
  }

  // 计算选中数量与金额，更新进度条、全选行和底部结算金额
  function renderSummary() {
    var count = 0, total = 0, allChecked = cart.length > 0;

    cart.forEach(function (item) {
      if (item.selected) {
        count++;
        total += getProduct(item.id).price * item.qty;
      } else {
        allChecked = false;
      }
    });

    var threshold = voucherCfg.threshold;
    var qualified = total >= threshold;
    var payable = qualified ? total * (1 - voucherCfg.discountRate) : total;

    // 进度条（空购物车时整块隐藏）
    var progressWrap = document.getElementById('progressWrap');
    progressWrap.style.display = cart.length === 0 ? 'none' : 'block';
    var pct = Math.min(100, total / threshold * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressAmt').textContent =
      money(total) + ' / ' + money(threshold);
    document.getElementById('progressText').innerHTML = qualified
      ? '10% discount applied ✓'
      : 'Add <b>' + money(threshold - total) + '</b> more to get 10% off';

    // 选中数量
    document.getElementById('selCount').textContent = count + ' selected';
    document.getElementById('cbCount').textContent = count + ' items selected';

    // 底部支付金额：满减后按 9 折支付
    document.getElementById('cbTotal').textContent = money(payable);

    // 全选圆圈
    var allCircle = document.getElementById('allCircle');
    allCircle.classList.toggle('checked', allChecked);
    allCircle.innerHTML = allChecked ? '<span class="ico">' + Icon.check + '</span>' : '';

    document.getElementById('btnCheckout').classList.toggle('disabled', count === 0);

    // 仅在“从未达标 → 达标”的瞬间弹窗
    if (qualified && !wasQualified) {
      showVoucherPopup(total * voucherCfg.discountRate);
    }
    wasQualified = qualified;

    // 同步右上角购物车入口角标（删除/加减数量后实时刷新）
    renderBadges();
  }

  // 列表事件：勾选 / 删除（事件委托）
  document.getElementById('cartList').addEventListener('click', function (e) {
    var toggleBtn = e.target.closest('[data-toggle]');
      if (toggleBtn) {
      var id = toggleBtn.getAttribute('data-toggle');
      cart.forEach(function (item) {
        if (item.id === id) item.selected = !item.selected;
      });
      persist();
      renderCart();
      renderSummary();
      return;
    }

    var plusBtn = e.target.closest('[data-plus]');
    if (plusBtn) {
      var plusId = plusBtn.getAttribute('data-plus');
      cart.forEach(function (item) {
        if (item.id === plusId) item.qty += 1;
      });
      persist();
      renderCart();
      renderSummary();
      return;
    }

    var minusBtn = e.target.closest('[data-minus]');
    if (minusBtn) {
      var minusId = minusBtn.getAttribute('data-minus');
      cart.forEach(function (item) {
        if (item.id === minusId) item.qty -= 1;
      });
      // 数量减到 0：移除该商品
      cart = cart.filter(function (item) { return item.qty > 0; });
      persist();
      renderCart();
      renderSummary();
      return;
    }

    var delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      var delId = delBtn.getAttribute('data-del');
      cart = cart.filter(function (item) { return item.id !== delId; });
      persist();
      renderCart();
      renderSummary();
    }
  });

  // 全选 / 取消全选
  document.getElementById('allCircle').addEventListener('click', function () {
    var hasUnchecked = cart.some(function (item) { return !item.selected; });
    cart.forEach(function (item) { item.selected = hasUnchecked; });
    persist();
    renderCart();
    renderSummary();
  });

  // 去结算（未选中商品时不可点）：直接跳转订单确认页，在该页才走支付弹窗
  document.getElementById('btnCheckout').addEventListener('click', function () {
    if (this.classList.contains('disabled')) return;
    location.href = 'checkout.html';
  });

  renderCart();
  renderSummary();
</script>
</body>
</html>
